name: Auto-fix LeetCode folder numbers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check and repair LeetCode folders
        run: python tools/auto_repair_leetcode_folders.py

      - name: Commit automatic repairs
        run: |
          if git diff --quiet; then
            echo "No folder-number repairs needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: fix LeetCode folder numbering"
          git push
